<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Receipt - UPI Pay</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        @media print {
            .desktop-navbar, .btn-print, .btn-back, .bottom-nav {
                display: none !important;
            }
            .main-wrapper {
                padding: 0 !important;
            }
            .receipt-card {
                box-shadow: none !important;
                border: 1px solid #000 !important;
            }
        }
    </style>
</head>
<body>
    <!-- Desktop Top Navbar -->
    <header class="desktop-navbar">
        <div class="desktop-navbar-inner">
            <a href="dashboard.html" class="nav-brand">
                <div class="brand-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                        <line x1="2" y1="10" x2="22" y2="10"></line>
                    </svg>
                </div>
                <span>UPI PAY</span>
            </a>

            <nav class="nav-links">
                <a href="dashboard.html" class="nav-link" data-nav="home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span>Dashboard</span>
                </a>
                <a href="send.html" class="nav-link" data-nav="send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    <span>Send Money</span>
                </a>
                <a href="history.html" class="nav-link active" data-nav="history">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>Passbook</span>
                </a>
                <a href="qr.html" class="nav-link" data-nav="qr">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <span>My QR</span>
                </a>
            </nav>

            <div class="nav-user-actions">
                <div class="user-profile-badge">
                    <div class="user-avatar-sm" id="user-avatar-initial">U</div>
                    <div>
                        <div class="user-name-sm" id="user-display-name">Loading...</div>
                        <div class="user-upi-sm" id="user-upi-id">user@simupi</div>
                    </div>
                </div>
                <button class="btn-logout" onclick="SimUPI.logout()" title="Logout">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Wrapper -->
    <main class="main-wrapper">
        <div class="centered-page-wrapper">
            <div class="receipt-card" id="receipt-container">
                <div class="receipt-header">
                    <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--success-bg); color: var(--success); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div style="font-size: 0.88rem; font-weight: 800; color: var(--success); text-transform: uppercase; letter-spacing: 0.5px;">
                        Transaction Complete
                    </div>
                    <div style="font-size: 2.2rem; font-weight: 800; color: var(--text-primary); margin: 8px 0;" id="rcpt-amount">
                        ₹0.00
                    </div>
                    <div id="rcpt-status-badge">
                        <span class="badge badge-success">SUCCESS</span>
                    </div>
                </div>

                <div class="receipt-row">
                    <span class="receipt-label">UPI Reference (UTR)</span>
                    <span class="receipt-val" id="rcpt-utr" style="font-family: monospace; font-size: 1rem; color: var(--primary);">
                        ••••••••••••
                    </span>
                </div>

                <div class="receipt-row">
                    <span class="receipt-label">Date & Time</span>
                    <span class="receipt-val" id="rcpt-time">-</span>
                </div>

                <div class="receipt-row">
                    <span class="receipt-label">Paid To</span>
                    <span class="receipt-val" id="rcpt-receiver">-</span>
                </div>

                <div class="receipt-row">
                    <span class="receipt-label">Receiver UPI ID</span>
                    <span class="receipt-val" id="rcpt-receiver-upi" style="font-family: monospace;">-</span>
                </div>

                <div class="receipt-row">
                    <span class="receipt-label">Paid By</span>
                    <span class="receipt-val" id="rcpt-sender">-</span>
                </div>

                <div class="receipt-row">
                    <span class="receipt-label">Debited Account</span>
                    <span class="receipt-val" id="rcpt-sender-acc" style="font-family: monospace;">-</span>
                </div>

                <div class="receipt-row">
                    <span class="receipt-label">Note</span>
                    <span class="receipt-val" id="rcpt-note">-</span>
                </div>

                <div id="failure-reason-row" class="receipt-row" style="display: none; color: var(--danger);">
                    <span class="receipt-label" style="color: var(--danger);">Failure Details</span>
                    <span class="receipt-val" id="rcpt-failure-reason" style="color: var(--danger);">-</span>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button type="button" class="btn btn-primary btn-print" onclick="window.print()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    PRINT RECEIPT
                </button>
                <a href="dashboard.html" class="btn btn-outline btn-back">
                    BACK TO DASHBOARD
                </a>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await SimUPI.requireAuth();
            if (!user) return;

            document.getElementById('user-display-name').textContent = user.name;
            document.getElementById('user-avatar-initial').textContent = user.name.charAt(0).toUpperCase();
            document.getElementById('user-upi-id').textContent = user.upiId;

            const urlParams = new URLSearchParams(window.location.search);
            const utr = urlParams.get('utr');

            if (!utr) {
                SimUPI.showToast('No transaction reference found', 'error');
                return;
            }

            fetchReceipt(utr);
        });

        async function fetchReceipt(utr) {
            try {
                const res = await SimUPI.apiFetch(`/transactions/${utr}`);
                const data = await res.json();

                if (!res.ok || !data.success) {
                    SimUPI.showToast(data.message || 'Receipt could not be loaded', 'error');
                    return;
                }

                const tx = data.data;
                document.getElementById('rcpt-amount').textContent = SimUPI.formatINR(tx.amount);
                document.getElementById('rcpt-utr').textContent = tx.utr;
                document.getElementById('rcpt-time').textContent = SimUPI.formatDateTime(tx.createdAt);
                document.getElementById('rcpt-receiver').textContent = tx.receiverName || 'UPI User';
                document.getElementById('rcpt-receiver-upi').textContent = tx.receiverUpiId || '-';
                document.getElementById('rcpt-sender').textContent = tx.senderName || 'Self';
                document.getElementById('rcpt-sender-acc').textContent = tx.senderMaskedAccount || 'Virtual Account';
                document.getElementById('rcpt-note').textContent = tx.note || 'None';

                const statusBadge = document.getElementById('rcpt-status-badge');
                statusBadge.innerHTML = `<span class="badge badge-${tx.status.toLowerCase()}">${tx.status}</span>`;

                if (tx.status === 'FAILED' && tx.failureReason) {
                    const failRow = document.getElementById('failure-reason-row');
                    failRow.style.display = 'flex';
                    document.getElementById('rcpt-failure-reason').textContent = tx.failureReason;
                }
            } catch (err) {
                SimUPI.showToast(err.message || 'Error loading receipt', 'error');
            }
        }
    </script>
</body>
</html>
