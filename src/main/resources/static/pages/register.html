<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Account - UPI Pay</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .register-page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f6 100%);
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="register-page-container">
        <div class="register-card">
            <div style="text-align: center; margin-bottom: 24px;">
                <div style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; box-shadow: 0 6px 16px rgba(95, 37, 159, 0.25);">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                        <line x1="2" y1="10" x2="22" y2="10"></line>
                    </svg>
                </div>
                <h1 style="font-size: 1.45rem; font-weight: 800; letter-spacing: -0.5px;">Open UPI Account</h1>
                <p style="font-size: 0.88rem; color: var(--text-secondary); margin-top: 4px;">Link a virtual bank account and set up your UPI PIN</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Full Legal Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g. Arjun Sharma" required autofocus>
                </div>

                <div style="margin-bottom: 14px; font-size: 0.82rem; background: var(--primary-subtle); padding: 10px 14px; border-radius: var(--radius-sm); border: 1px dashed var(--primary); display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: var(--text-secondary);">Auto-generated UPI ID:</span>
                    <strong id="upi-preview" style="color: var(--primary); font-family: monospace;">arjun@simupi</strong>
                </div>

                <div class="form-group">
                    <label for="reg-mobile">10-Digit Mobile Number</label>
                    <div class="phone-input-group">
                        <div class="country-prefix">🇮🇳 +91</div>
                        <input type="tel" id="reg-mobile" class="phone-control" placeholder="98123 45678" maxlength="10" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g. arjun@example.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-password">Account Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0 16px;">
                <h3 style="font-size: 0.95rem; font-weight: 800; color: var(--primary); margin-bottom: 14px;">
                    Bank Account Details
                </h3>

                <div class="form-group">
                    <label for="reg-bank">Select Bank</label>
                    <select id="reg-bank" class="form-control" required>
                        <option value="HDFC Bank">HDFC Bank</option>
                        <option value="State Bank of India">State Bank of India (SBI)</option>
                        <option value="ICICI Bank">ICICI Bank</option>
                        <option value="Axis Bank">Axis Bank</option>
                        <option value="Punjab National Bank">Punjab National Bank</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reg-type">Account Type</label>
                    <select id="reg-type" class="form-control" required>
                        <option value="SAVINGS">Savings Account (Daily Limit: ₹1,00,000)</option>
                        <option value="CURRENT">Current Account (Daily Limit: ₹2,00,000)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reg-balance">Opening Balance (₹)</label>
                    <input type="number" id="reg-balance" class="form-control" value="25000.00" min="1000" step="500" required>
                </div>

                <div class="form-group">
                    <label for="reg-pin">Set 4-Digit UPI PIN</label>
                    <input type="password" id="reg-pin" class="form-control" placeholder="e.g. 1234" maxlength="4" minlength="4" required>
                </div>

                <button type="submit" class="btn btn-primary" id="reg-submit-btn" style="margin-top: 18px; padding: 14px; font-size: 1rem;">
                    CREATE ACCOUNT
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--text-secondary);">
                Already have an account? 
                <a href="/pages/login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Login</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AuthModule.initRegisterPage();
        });
    </script>
</body>
</html>
