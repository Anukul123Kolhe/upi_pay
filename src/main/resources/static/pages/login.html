<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UPI Pay</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .login-page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f6 100%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            border: 1px solid var(--border-color);
        }

        .login-brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo-large {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 14px;
            box-shadow: 0 8px 20px rgba(95, 37, 159, 0.25);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .trust-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .trust-badge svg {
            color: var(--success);
        }
    </style>
</head>
<body>
    <div class="login-page-container">
        <div class="login-card">
            <div class="login-brand-header">
                <div class="brand-logo-large">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                        <line x1="2" y1="10" x2="22" y2="10"></line>
                    </svg>
                </div>
                <h1 class="brand-title">UPI Pay</h1>
                <p class="brand-subtitle">Fast, Simple & Secure Digital Payments</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-mobile">Registered Mobile Number</label>
                    <div class="phone-input-group">
                        <div class="country-prefix">🇮🇳 +91</div>
                        <input type="tel" id="login-mobile" class="phone-control" placeholder="10-digit mobile number" maxlength="10" required autofocus>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 14px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="login-password">Password</label>
                    </div>
                    <input type="password" id="login-password" class="form-control" placeholder="Enter your account password" required>
                </div>

                <button type="submit" class="btn btn-primary" id="login-submit-btn" style="margin-top: 20px; padding: 14px; font-size: 1rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    LOGIN SECURELY
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--text-secondary);">
                Don't have an account? 
                <a href="/pages/register.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create Account</a>
            </div>

            <div class="trust-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                Bank-Grade 256-Bit SSL Encrypted
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await SimUPI.apiFetch('/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && data.data) {
                        window.location.replace('/pages/dashboard.html');
                    }
                }
            } catch (ignored) {}
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mobile = document.getElementById('login-mobile').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-submit-btn');

            if (!/^[6-9]\d{9}$/.test(mobile)) {
                SimUPI.showToast('Please enter a valid 10-digit Indian mobile number', 'error');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = 'Authenticating...';

                const res = await SimUPI.apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ mobile, password })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    SimUPI.showToast(data.message || 'Invalid mobile number or password', 'error');
                    return;
                }

                SimUPI.showToast(`Welcome back, ${data.data.name}!`, 'success');
                setTimeout(() => {
                    window.location.href = '/pages/dashboard.html';
                }, 300);
            } catch (err) {
                SimUPI.showToast(err.message || 'Unable to connect to server. Ensure port 8080 is active.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    LOGIN SECURELY
                `;
            }
        });
    </script>
</body>
</html>
