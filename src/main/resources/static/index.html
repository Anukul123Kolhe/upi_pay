<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Pay</title>
    <script>
        // Check session and redirect seamlessly
        fetch('/api/auth/me')
            .then(res => res.json())
            .then(data => {
                if (data.success && data.data) {
                    window.location.replace('/pages/dashboard.html');
                } else {
                    window.location.replace('/pages/login.html');
                }
            })
            .catch(() => {
                window.location.replace('/pages/login.html');
            });
    </script>
</head>
<body style="background: #5f259f; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif;">
    <div style="text-align: center;">
        <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 8px;">UPI Pay</h2>
        <p style="font-size: 0.9rem; opacity: 0.85;">Opening application...</p>
    </div>
</body>
</html>
